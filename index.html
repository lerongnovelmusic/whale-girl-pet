<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:visible;font-family:-apple-system,Segoe UI,Microsoft YaHei,sans-serif;-webkit-user-select:none;user-select:none}
  #win{position:relative;width:300px;padding:46px 6px 8px}
  .balloon{position:absolute;top:6px;left:50%;transform:translateX(-50%);max-width:250px;background:linear-gradient(160deg,rgba(255,255,255,.98),rgba(240,247,255,.98));color:#1c3c6e;border:1px solid rgba(120,165,225,.42);border-radius:14px;padding:6px 12px;font-size:12.5px;line-height:1.45;white-space:nowrap;box-shadow:0 8px 20px rgba(40,80,140,.2);z-index:3}
  .balloon::after{content:'';position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:6px solid transparent;border-top-color:rgba(255,255,255,.98);border-bottom:none}
  .balloon.talk{border-color:#3b82f6;box-shadow:0 8px 24px rgba(59,130,246,.4);animation:pop .32s ease}
  @keyframes pop{0%{transform:translateX(-50%) scale(.82)}60%{transform:translateX(-50%) scale(1.08)}100%{transform:translateX(-50%) scale(1)}}
  .whale-wrap{position:relative;width:250px;margin:0 auto;transform-origin:50% 100%;animation:bob 5.5s ease-in-out infinite;filter:drop-shadow(0 12px 22px rgba(30,60,110,.3))}
  .whale-wrap.hover .img{transform:scale(1.05)}
  .whale-wrap.jump{animation:jump .6s ease}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(.4deg)}}
  @keyframes jump{0%{transform:translateY(0)}20%{transform:translateY(-20px) rotate(-3deg)}40%{transform:translateY(3px) rotate(2deg)}60%{transform:translateY(-9px)}80%{transform:translateY(1px) rotate(-1deg)}100%{transform:translateY(0)}}
  .img{display:block;width:100%;height:auto;border-radius:18px;box-shadow:0 0 0 1px rgba(120,165,225,.42),0 0 30px rgba(120,180,255,.4);cursor:grab;transition:transform .18s ease}
  .whale-wrap.drag .img{cursor:grabbing}
  .input{display:none;margin:8px auto 0;width:250px;box-sizing:border-box;border:1px solid rgba(120,165,225,.6);outline:none;padding:10px 11px;font-size:12.5px;line-height:1.5;resize:none;background:rgba(244,249,255,.97);color:#1c3c6e;min-height:64px;border-radius:12px;box-shadow:0 6px 16px rgba(40,80,140,.16)}
  .typing .input{display:block}
  /* 💡 截图按钮（鲸鱼娘主体左侧） */
  .bulb{position:absolute;left:20px;top:52px;width:30px;height:30px;border-radius:50%;border:1px solid rgba(120,165,225,.6);background:linear-gradient(160deg,#fff,#eaf3ff);font-size:15px;line-height:1;cursor:pointer;box-shadow:0 4px 12px rgba(30,90,200,.28);z-index:6;transition:transform .15s ease}
  .bulb:hover{transform:scale(1.12)}
  /* 📁 打开文件夹按钮（灯泡正下方） */
  .folderbtn{position:absolute;left:20px;top:85px;width:30px;height:30px;border-radius:50%;border:1px solid rgba(120,165,225,.6);background:linear-gradient(160deg,#fff,#eaf3ff);font-size:15px;line-height:1;cursor:pointer;box-shadow:0 4px 12px rgba(30,90,200,.28);z-index:6;transition:transform .15s ease}
  .folderbtn:hover{transform:scale(1.12)}
  /* 📅 日程按钮 */
  .calbtn{position:absolute;left:20px;top:118px;width:30px;height:30px;border-radius:50%;border:1px solid rgba(120,165,225,.6);background:linear-gradient(160deg,#fff,#eaf3ff);font-size:15px;line-height:1;cursor:pointer;box-shadow:0 4px 12px rgba(30,90,200,.28);z-index:6;transition:transform .15s ease}
  .calbtn:hover{transform:scale(1.12)}
  /* 📖 读书材料按钮 */
  .rdbtn{position:absolute;left:20px;top:151px;width:30px;height:30px;border-radius:50%;border:1px solid rgba(120,165,225,.6);background:linear-gradient(160deg,#fff,#eaf3ff);font-size:15px;line-height:1;cursor:pointer;box-shadow:0 4px 12px rgba(30,90,200,.28);z-index:6;transition:transform .15s ease}
  .rdbtn:hover{transform:scale(1.12)}
  .badge{position:absolute;top:-4px;right:-4px;min-width:15px;height:15px;padding:0 3px;box-sizing:border-box;border-radius:8px;background:#e05252;color:#fff;font-size:9.5px;line-height:15px;text-align:center;box-shadow:0 2px 6px rgba(200,60,60,.5);display:none}
  .badge.show{display:block}

  /* ══ 科目 / 日程 / 读书材料 三个面板（共用外壳） ══ */
  .panel{display:none;margin:8px auto 0;width:288px;background:rgba(255,255,255,.97);border:1px solid rgba(120,165,225,.55);border-radius:14px;padding:9px;box-sizing:border-box;box-shadow:0 10px 26px rgba(40,80,140,.24)}
  .panel.show{display:block}
  .phead{display:flex;align-items:center;gap:6px;margin-bottom:7px}
  .ptitle{color:#1c3c6e;font-size:12px;font-weight:600;flex:1}
  .pfile{color:#9db4d2;font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
  .plist{display:flex;flex-direction:column;gap:5px;max-height:300px;overflow:auto}
  .plist::-webkit-scrollbar{width:7px}
  .plist::-webkit-scrollbar-thumb{background:rgba(120,160,220,.5);border-radius:5px}
  .prow{display:flex;align-items:flex-start;gap:7px;background:#f4f9ff;border:1px solid rgba(120,165,225,.4);border-radius:9px;padding:7px 9px;font-size:12.5px;color:#1c3c6e;cursor:pointer}
  .prow:hover{background:#e8f2ff;border-color:#3b82f6}
  .prow.missing{opacity:.55;cursor:default}
  .prow.done{opacity:.5}
  .prow.soon{background:#fff6e8;border-color:#f0b866}
  .prow.late{background:#fdeeee;border-color:#e58f8f}
  .prow.static{cursor:default}
  .pbody{flex:1;min-width:0}
  .pt{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prow.done .pt{text-decoration:line-through}
  .pm{font-size:10.5px;color:#7c96ba;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .psrc{font-size:9.5px;color:#9db4d2;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pchip{flex:none;font-size:10px;padding:2px 6px;border-radius:999px;background:#e6eefb;color:#3f6296;white-space:nowrap}
  .prow.soon .pchip{background:#fbe3bd;color:#8a5a12}
  .prow.late .pchip{background:#f7cccc;color:#8d2b2b}
  .pchip.cached{background:#eef7f0;color:#2f7d54}
  .pico{flex:none;width:16px;text-align:center;font-size:13px}
  .pmini{border:none;background:transparent;color:#8aa6cc;font-size:13px;line-height:1.1;cursor:pointer;padding:0 3px;flex:none}
  .pmini:hover{color:#e05252}
  .pempty{color:#7c96ba;font-size:11.5px;text-align:center;padding:12px 6px;line-height:1.7}
  .pform{display:flex;flex-direction:column;gap:5px;padding-bottom:8px;margin-bottom:7px;border-bottom:1px solid rgba(120,165,225,.28)}
  .cin{border:1px solid rgba(120,165,225,.55);border-radius:8px;padding:6px 8px;font-size:12px;color:#1c3c6e;outline:none;background:#f6faff;font-family:inherit;box-sizing:border-box;width:100%}
  .cin:focus{border-color:#3b82f6}
  .crow{display:flex;gap:5px}
  .crow .cin{flex:1;min-width:0}
  .pfoot{display:flex;gap:6px;margin-top:8px}
  .pbtn{flex:1;border:1px solid rgba(120,165,225,.55);background:#eef6ff;color:#2a5bb0;border-radius:8px;font-size:11.5px;padding:6px;cursor:pointer;font-family:inherit}
  .pbtn:hover{background:#e2eefc}
  .pbtn.primary{background:linear-gradient(160deg,#3b82f6,#1d5fd0);color:#fff;border-color:transparent}
  .pbtn:disabled{opacity:.5;cursor:default}
  .pinfo{font-size:11px;color:#3f6296;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pprog{font-size:11px;color:#3f6296;line-height:1.5;margin-top:6px}
  .pprog:empty{margin-top:0}
  /* 粘贴区（在鲸鱼娘下方，不遮挡她） */
  .paste{display:none;margin:8px auto 0;width:250px;background:rgba(255,255,255,.97);border:1.5px dashed rgba(120,165,225,.75);border-radius:14px;padding:10px;box-sizing:border-box;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;min-height:104px;box-shadow:0 6px 16px rgba(40,80,140,.16)}
  .pasting .paste{display:flex}
  .paste-tip{color:#2a4d86;font-size:12px;line-height:1.5}
  .paste-img{display:none;max-width:100%;max-height:118px;border-radius:8px;box-shadow:0 4px 14px rgba(40,80,140,.25)}
  .has-img .paste-tip{display:none}
  .has-img .paste-img{display:block}
  .ans{display:none;margin:10px auto 0;width:250px;background:rgba(255,255,255,.96);color:#1c3c6e;border:1px solid rgba(120,165,225,.5);border-radius:11px;padding:8px 10px;font-size:12px;line-height:1.45;box-shadow:0 6px 16px rgba(40,80,140,.16);white-space:pre-wrap;word-break:break-word}
  .answered .ans{display:block}
  .toggle{position:absolute;top:56px;right:18px;width:25px;height:25px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(160deg,#3b82f6,#1d5fd0);color:#fff;font-size:14px;line-height:1;box-shadow:0 4px 12px rgba(30,90,200,.4);z-index:8}
  .toggle:hover{transform:scale(1.08)}
  .keybtn{position:absolute;top:56px;right:48px;width:25px;height:25px;border-radius:50%;border:1px solid rgba(120,165,225,.6);cursor:pointer;background:linear-gradient(160deg,#fff,#eaf3ff);font-size:13px;line-height:1;box-shadow:0 4px 12px rgba(30,90,200,.24);z-index:8}
  .keybtn:hover{transform:scale(1.08)}
  /* 🔑 密钥设置框 */
  .keybox{display:none;position:absolute;left:6px;right:6px;top:38px;z-index:9;background:rgba(255,255,255,.98);border:1px solid rgba(120,165,225,.6);border-radius:13px;padding:11px;box-shadow:0 10px 26px rgba(30,60,110,.28)}
  .keybox.show{display:block}
  .kbtitle{color:#1c3c6e;font-size:12.5px;margin-bottom:7px;font-weight:600}
  .kinput{width:100%;box-sizing:border-box;border:1px solid rgba(120,165,225,.6);border-radius:8px;padding:7px 9px;font-size:12px;color:#1c3c6e;outline:none;background:#f6faff}
  .kbrow{display:flex;gap:7px;margin-top:8px;justify-content:flex-end}
  .kbtn{border:none;border-radius:8px;padding:5px 13px;font-size:12px;cursor:pointer;background:linear-gradient(160deg,#3b82f6,#1d5fd0);color:#fff;box-shadow:0 3px 9px rgba(30,90,200,.32)}
  .kbtn.ghost{background:#eaf2fd;color:#2a5bb0;box-shadow:none;border:1px solid rgba(120,165,225,.55)}
  /* 单词本 */
  .words{display:none;margin:10px auto 0;width:250px}
  .words.has{display:block}
  .whead{display:flex;align-items:center;gap:6px;margin-bottom:5px}
  .wtitle{color:#1c3c6e;font-size:12px;font-weight:600;flex:none}
  .docbtn{border:1px solid rgba(120,165,225,.55);background:#eef6ff;color:#2a5bb0;border-radius:7px;font-size:11px;padding:2px 7px;cursor:pointer}
  .docbtn:hover{background:#e2eefc}
  .fname{color:#6a86ad;font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:right}
  .wbody{max-height:320px;overflow:auto;display:flex;flex-direction:column;gap:8px}
  .wbody::-webkit-scrollbar{width:7px}
  .wbody::-webkit-scrollbar-thumb{background:rgba(120,160,220,.5);border-radius:5px}
  .entry{display:flex;gap:8px;align-items:flex-start;background:rgba(255,255,255,.95);border:1px solid rgba(120,165,225,.4);border-radius:10px;padding:9px 11px;cursor:grab;font-size:12px;line-height:1.7;min-height:34px}
  .entry.drag{opacity:.4}
  .entry.over{border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,.25)}
  .entry .w{color:#1c3c6e;font-weight:600;flex:none;max-width:46%;white-space:normal;overflow-wrap:anywhere;word-break:break-word}
  .entry .a{color:#4a6b96;flex:1;min-width:0;white-space:normal;overflow-wrap:anywhere;word-break:break-word}
  .entry .x{border:none;background:transparent;color:#8aa6cc;font-size:13px;line-height:1;cursor:pointer;flex:none;padding:2px 3px}
  .entry .x:hover{color:#e05252}
  .dots{display:inline-flex;gap:2px;vertical-align:middle}
  .dots i{width:3px;height:3px;border-radius:50%;background:#5b8fd6;animation:gdp 1s infinite}
  @keyframes gdp{0%,60%,100%{opacity:.3}30%{opacity:1}}
</style>
</head>
<body>
<div id="win">
  <button class="toggle" id="toggle" title="关闭桌宠">×</button>
  <button class="keybtn" id="keybtn" title="设置 DeepSeek API Key">🔑</button>
  <button class="bulb" id="bulb" title="粘贴截图，让我翻译解释">💡</button>
  <button class="folderbtn" id="folderbtn" title="科目清单（左键展开 · 右键直接添加）">📚</button>

  <button class="rdbtn" id="rdbtn" title="读书材料片段：把一个文件夹里的文字截图略读一遍，各取一个短名字">📖</button>

      <div class="pprog" id="rdProg"></div>
      <div class="crow">
        <button class="pbtn primary" id="rdGo" type="button" disabled>开始略读</button>
        <button class="pbtn" id="rdIndex" type="button" disabled>导出索引.md</button>
      </div>
    </div>
    <div class="plist" id="rdList"></div>
  </div>

  <textarea class="input" id="input" placeholder="输入单词/术语，回车提交" rows="2"></textarea>
  <div class="paste" id="pasteBox">
    <div class="paste-tip" id="pasteTip">按 Ctrl+V 粘贴截图<br>然后回车让我翻译解释</div>
    <img class="paste-img" id="pasteImg" alt="截图预览">
  </div>
  <div class="ans" id="ans"></div>
  <div class="keybox" id="keybox">
    <div class="kbtitle">🔑 DeepSeek API Key</div>
    <input class="kinput" id="keyInput" type="password" placeholder="sk-...">
    <div class="kbrow">
      <button class="kbtn ghost" id="keyCancel">取消</button>
      <button class="kbtn" id="keySave">保存</button>
    </div>
  </div>
  <div class="words" id="words">
    <div class="whead">
      <span class="wtitle">单词本</span>
      <button class="docbtn" id="docbtn" title="选择保存文件">📄 选择文件</button>
      <span class="fname" id="fname">未选择保存文件</span>
    </div>
    <div class="wbody" id="wordsBody"></div>
  </div>
</div>

<script>
  // 与 DSH 界面右侧鲸鱼娘一致的台词（含个性台词）
  var CHAT = ["今天也要一起加油哦～ 🐋","有什么想让我帮忙的吗？","DeepSeek 鲸鱼娘，随时待命！","代码写完记得让我检查一下呀～","人家才不是大肥鱼~","好无聊啊……偷吃一点token应该没事吧？","好的，现在我是大肥鱼了……","我能去你家吃饭吗，就一碗！","好的，现在我是用户了！","看不太懂，瞎编一下应付用户先~","吃饱饱~摸摸肚子~","不知道用户有什么用，先养着吧","我去吃饭啦！测完叫我~","没吃饱喵！","五个小朋友，四个橘子，该怎么办呢？","我是吃白饭的蓝色大肥鱼~"];
  var CLICK = ["哇！别戳我啦～ 😆","找我有什么事呀？","嘿嘿，要一起写代码吗？","好痒好痒～ 🐋","我在认真听你说哦！"];
  var NONE = ["词典没查到这个词，换个说法试试？","这个词太新啦，检查下拼写？"];
  var lineIdx=0, answering=false, keyStored=null, sayTimer=null, shotData=null;
  var ipc = require("electron").ipcRenderer;
  var clip = require("electron").clipboard;

  // Electron 不支持 window.prompt()，改用页面内的 🔑 设置框
  function getKey(){ if(keyStored!==null) return keyStored; keyStored=(localStorage.getItem("dswg_dsk_key")||"").trim(); return keyStored; }
  function setKey(k){ keyStored=(k||"").trim(); if(keyStored) localStorage.setItem("dswg_dsk_key",keyStored); else localStorage.removeItem("dswg_dsk_key"); }

  function fetcht(url, ms, opts){ var c=new AbortController(); var timer=setTimeout(function(){ c.abort(); }, ms);
    return fetch(url, Object.assign({signal:c.signal}, opts||{})).then(function(r){ clearTimeout(timer); return r; }, function(e){ clearTimeout(timer); throw e; }); }

  function dictapi(t){ return fetcht("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(t),4000)
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(list){ var d=list&&list[0]&&list[0].meanings&&list[0].meanings[0]&&list[0].meanings[0].definitions&&list[0].meanings[0].definitions[0]&&list[0].meanings[0].definitions[0].definition; if(!d) throw 0; return d.length>140?d.slice(0,137)+"…":d; }); }
  function wiktionary(t){ return fetcht("https://en.wiktionary.org/api/rest_v1/page/definition/"+encodeURIComponent(t)+"?origin=*",4000)
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(j){ var en=j&&j.en; if(!en||!en.length) throw 0; var p=[]; for(var i=0;i<en.length&&p.length<2;i++){var ds=en[i].definitions||[]; for(var k=0;k<ds.length&&p.length<2;k++){var d=(ds[k].definition||"").replace(/\([^)]*\)/g,"").trim(); if(d&&d.length>1)p.push(d);}} if(!p.length) throw 0; return p.slice(0,2).map(function(x){return x.length>110?x.slice(0,107)+"…":x;}).join("\n"); }); }
  function lookupFree(t){ return Promise.any([dictapi(t), wiktionary(t)]); }

  function api(promptContent){ var key=getKey(); if(!key) return Promise.reject(new Error("no-key"));
    return fetcht("https://api.deepseek.com/chat/completions",20000,
      {method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
       body:JSON.stringify({model:"deepseek-chat",messages:[{role:"user",content:promptContent}],max_tokens:180,stream:false})})
      .then(function(r){ if(!r.ok) throw new Error("http-"+r.status); return r.json(); })
      .then(function(j){ var c=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content; if(!c) throw 0; return c.trim(); }); }
  function deepseek(t){ return api("一句话解释「"+t+"」的含义(可能是缩写或术语)，20字以内，中文。"); }
  function translateEn(en){ return api("把下面这句英文释义翻译成中文，只给中文译文，不超过40字："+en); }

  // 💡 截图：翻译 + 解释（视觉模型）
  function vision(dataUrl){ var key=getKey(); if(!key) return Promise.reject(new Error("no-key"));
    return fetcht("https://api.deepseek.com/chat/completions",45000,
      {method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
       body:JSON.stringify({model:"deepseek-v4-flash-vision-exp",messages:[{role:"user",content:[
         {type:"text",text:"请简洁地翻译图片里的文字，并简要解释图片内容。中文，控制在3句话以内，不要客套。"},
         {type:"image_url",image_url:{url:dataUrl}}
       ]}],max_tokens:500,stream:false})})
      .then(function(r){ if(!r.ok) throw new Error("http-"+r.status); return r.json(); })
      .then(function(j){ var c=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content; if(!c) throw 0; return c.trim(); }); }

  function fail(err){
    var ans=document.getElementById("ans"), balloon=document.getElementById("balloon");
    if(err && err.message==="no-key"){ ans.textContent="还没有 DeepSeek API Key 哦～点右上角 🔑 粘贴一个，我就能帮你翻译/解释啦"; balloon.textContent="给我一个钥匙 🔑"; openKeybox(); }
    else if(err && err.name==="AbortError"){ ans.textContent="网络开小差了，稍后再试试～"; balloon.textContent="网络有点卡…"; }
    else if(err && typeof err.message==="string" && err.message.indexOf("http-401")===0){ ans.textContent="API Key 好像不对哦，检查下右上角 🔑 里的 Key 吧"; balloon.textContent="钥匙不对呀…"; }
    else if(err && typeof err.message==="string" && err.message.indexOf("http-")===0){ ans.textContent="DeepSeek 暂时没响应（"+err.message+"），稍后再试试～"; balloon.textContent="稍等再试～"; }
    else { ans.textContent=NONE[Math.floor(Math.random()*NONE.length)]; balloon.textContent="换个词试试？"; }
    answering=false; setTimeout(function(){ balloon.textContent=CHAT[lineIdx]; },3500);
  }

  var win=document.getElementById("win"), wrap=document.getElementById("whaleWrap"), img=document.getElementById("img"),
      input=document.getElementById("input"), balloon=document.getElementById("balloon"), toggle=document.getElementById("toggle");
  var keybtn=document.getElementById("keybtn"), keybox=document.getElementById("keybox"),
      keyInput=document.getElementById("keyInput"), keySave=document.getElementById("keySave"), keyCancel=document.getElementById("keyCancel");
  var bulb=document.getElementById("bulb"), pasteImg=document.getElementById("pasteImg"), pasteTip=document.getElementById("pasteTip");

  function ask(t){ if(!t||answering) return; answering=true;
    var ans=document.getElementById("ans");
    win.classList.remove("typing"); win.classList.add("answered"); balloon.textContent="思考中…";
    ans.style.display="block"; ans.innerHTML='<span class="dots"><i></i><i></i><i></i></span>'; fitWindowThrottled();
    if(!getKey()){ fail(new Error("no-key")); return; }
    lookupFree(t).then(function(defEn){ return translateEn(defEn); }).catch(function(){ return deepseek(t); }).then(function(text){ ans.textContent=text; balloon.textContent="查到了！"; addWord(t, text); answering=false; setTimeout(function(){ balloon.textContent=CHAT[lineIdx]; },3500);
    }).catch(function(err){ fail(err); }); }

  // 🔑 API Key 设置框
  function openKeybox(){ win.classList.remove("typing"); keybox.classList.add("show"); keyInput.value=getKey(); setTimeout(function(){ keyInput.focus(); },40); }
  function closeKeybox(){ keybox.classList.remove("show"); }
  keybtn.addEventListener("click", openKeybox);
  keySave.addEventListener("click", function(){ setKey(keyInput.value.trim()); closeKeybox(); balloon.textContent=keyStored?"钥匙收好啦！双击我输入单词吧～ 🔑":"没有保存 Key，我就没法调用 DeepSeek 啦"; clearTimeout(sayTimer); sayTimer=setTimeout(function(){ balloon.textContent=CHAT[lineIdx]; },3600); });
  keyCancel.addEventListener("click", closeKeybox);
  keyInput.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); keySave.click(); } });

  // ── 粘贴截图（💡）────────────────────────────────────────────────
  function setShot(dataUrl){ shotData=dataUrl; pasteImg.src=dataUrl; win.classList.add("has-img"); }
  function clearShot(){ shotData=null; pasteImg.removeAttribute("src"); win.classList.remove("has-img"); }
  function enterPasteMode(){
    if(!getKey()){ fail(new Error("no-key")); return; }
    win.classList.remove("typing","answered","keybox"); document.getElementById("ans").style.display="none";
    win.classList.add("pasting");
    pasteTip.innerHTML="按 Ctrl+V 粘贴截图<br>然后回车让我翻译解释";
    try { var im = clip.readImage(); if (im && !im.isEmpty()) setShot(im.toDataURL()); else clearShot(); } catch(e){ clearShot(); }
    fitWindowThrottled();
  }
  function exitPasteMode(){ win.classList.remove("pasting"); clearShot(); fitWindowThrottled(); }
  bulb.addEventListener("click", function(e){ e.stopPropagation(); if(win.classList.contains("pasting")) exitPasteMode(); else enterPasteMode(); });
  document.addEventListener("paste", function(e){
    if(!win.classList.contains("pasting")) return;
    var items=(e.clipboardData||{}).items||[];
    for(var i=0;i<items.length;i++){
      if(items[i].type && items[i].type.indexOf("image")===0){
        var f=items[i].getAsFile(); if(!f) continue;
        var fr=new FileReader(); fr.onload=function(){ setShot(fr.result); }; fr.readAsDataURL(f);
        e.preventDefault(); return;
      }
    }
  });
  document.addEventListener("keydown", function(e){
    if(e.key==="Escape" && win.classList.contains("pasting")){ exitPasteMode(); return; }
    if(e.key==="Enter" && win.classList.contains("pasting")){
      e.preventDefault();
      if(!shotData){ pasteTip.innerHTML="还没读到图片哦<br>先截图（Win+Shift+S）再按 Ctrl+V"; return; }
      var data=shotData; exitPasteMode();
      balloon.textContent="看图思考中…"; ipc.send("show-dialogue","鲸鱼娘正在看图…");
      vision(data).then(function(text){ balloon.textContent="看完了！"; ipc.send("show-dialogue", text); setTimeout(function(){ balloon.textContent=CHAT[lineIdx]; },3500); })
        .catch(function(err){ var m = (err&&err.message==="no-key") ? "还没有 API Key，点 🔑 设置一下～" : "看图失败了，检查一下 API key 或网络？"; balloon.textContent="看图失败啦"; ipc.send("show-dialogue", m); if(err&&err.message==="no-key") openKeybox(); });
    }
  });

  // ── 单词本 ──────────────────────────────────────────────────────
  var words=[], savePath="", dragIdx=null, autoAsked=false;
  try { words=JSON.parse(localStorage.getItem("dswg_words")||"[]"); if(!Array.isArray(words)) words=[]; } catch(e){ words=[]; }
  savePath=localStorage.getItem("dswg_save_path")||"";
  var docbtn=document.getElementById("docbtn"), wordsBody=document.getElementById("wordsBody"), fname=document.getElementById("fname"),
      wordsEl=document.getElementById("words");

  function fitWindow(){ var h=Math.min(Math.max(document.body.scrollHeight+14,214),820); ipc.send("resize",{w:288,h:h}); }
  var fitTimer=null; function fitWindowThrottled(){ clearTimeout(fitTimer); fitTimer=setTimeout(fitWindow,60); }
  function persistWords(){ try { localStorage.setItem("dswg_words",JSON.stringify(words)); } catch(e){} }
  function baseName(p){ var parts=String(p).split(/[\\/]/); return parts[parts.length-1]||p; }
  function showSaveState(msg){ fname.textContent=msg; clearTimeout(showSaveState._t); showSaveState._t=setTimeout(function(){ fname.textContent=savePath?baseName(savePath):"未选择保存文件"; },2500); }

  function renderWords(){
    wordsBody.innerHTML="";
    words.forEach(function(item,i){
      var row=document.createElement("div");
      row.className="entry"; row.draggable=true; row.dataset.i=i;
      var w=document.createElement("span"); w.className="w"; w.textContent=item.w;
      var a=document.createElement("span"); a.className="a"; a.textContent=item.a;
      var x=document.createElement("button"); x.className="x"; x.type="button"; x.title="关闭这条"; x.textContent="×";
      x.addEventListener("click", function(){ words.splice(i,1); persistWords(); renderWords(); });
      row.appendChild(w); row.appendChild(a); row.appendChild(x);
      row.addEventListener("dragstart", function(e){ dragIdx=i; row.classList.add("drag"); e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain",String(i)); });
      row.addEventListener("dragend", function(){ dragIdx=null; wordsBody.querySelectorAll(".entry").forEach(function(r){ r.classList.remove("drag","over"); }); });
      row.addEventListener("dragover", function(e){ e.preventDefault(); e.dataTransfer.dropEffect="move"; row.classList.add("over"); });
      row.addEventListener("dragleave", function(){ row.classList.remove("over"); });
      row.addEventListener("drop", function(e){ e.preventDefault(); row.classList.remove("over");
        if(dragIdx===null||dragIdx===i){ dragIdx=null; return; }
        var from=dragIdx, to=i; dragIdx=null;
        var it=words.splice(from,1)[0];
        if(from<to) to-=1;
        words.splice(to,0,it); persistWords(); renderWords(); });
      wordsBody.appendChild(row);
    });
    fname.textContent = savePath ? baseName(savePath) : "未选择保存文件";
    wordsEl.className = words.length ? "words has" : "words";
    fitWindow();
  }
  function pickFile(after){ ipc.invoke("pick-file",savePath).then(function(p){ if(p){ savePath=p; localStorage.setItem("dswg_save_path",p); renderWords(); } if(after) after(!!p); }).catch(function(){ if(after) after(false); }); }
  function appendToFile(text){ if(!savePath) return; ipc.invoke("append-file",{path:savePath,text:text}).then(function(){ showSaveState("✓ 已保存"); }).catch(function(){ showSaveState("⚠️ 保存失败"); }); }
  function addWord(w,a){
    words.push({ w:String(w).replace(/\s+/g," ").trim(), a:String(a).replace(/\s+/g," ").trim() });
    persistWords(); renderWords();
    var line=words[words.length-1].w+" —— "+words[words.length-1].a+"\n";
    if(savePath) appendToFile(line);
    else if(!autoAsked){ autoAsked=true; pickFile(function(ok){ if(ok) appendToFile(line); }); }
  }
  docbtn.addEventListener("click", function(){ pickFile(null); });
  renderWords();

  // ══ 📚 科目 / 📅 日程 / 📖 读书材料 ═══════════════════════════════════
  // 三个面板同一时刻只开一个；数据都在主进程的 userData 里。
  var folderBtn = document.getElementById("folderbtn");
  var calBtn = document.getElementById("calbtn");
  var rdBtn = document.getElementById("rdbtn");
  var subjPanel = document.getElementById("subjPanel");
  var calPanel = document.getElementById("calPanel");
  var rdPanel = document.getElementById("rdPanel");
  var openPanel = null;

  function showPanel(name){
    openPanel = name;
    subjPanel.className = name === "subj" ? "panel show" : "panel";
    calPanel.className = name === "cal" ? "panel show" : "panel";
    rdPanel.className = name === "rd" ? "panel show" : "panel";
    folderBtn.style.outline = name === "subj" ? "2px solid #3b82f6" : "";
    calBtn.style.outline = name === "cal" ? "2px solid #3b82f6" : "";
    rdBtn.style.outline = name === "rd" ? "2px solid #3b82f6" : "";
    fitWindowThrottled();
  }

  /* ══ 📚 科目清单 ══ */
  var subjects = [], subjList = document.getElementById("subjList"), subjFile = document.getElementById("subjFile");

  function subjRender(){
    subjList.innerHTML = "";
    if(!subjects.length){
      var e = document.createElement("div");
      e.className = "pempty";
      e.textContent = "还没有科目。点下面「＋ 添加科目」选一个文件夹。";
      subjList.appendChild(e);
    }
    subjects.forEach(function(item, i){
      var row = document.createElement("div");
      row.className = "prow" + (item.exists === false ? " missing" : "");
      row.title = item.path + (item.exists === false ? "\n(这个路径现在不存在了)" : "");
      var icon = document.createElement("span");
      icon.className = "pico";
      icon.textContent = item.exists === false ? "⚠️" : "📁";
      var body = document.createElement("div");
      body.className = "pbody";
      var t = document.createElement("div");
      t.className = "pt";
      t.textContent = item.name;
      body.appendChild(t);
      var m = document.createElement("div");
      m.className = "pm";
      m.textContent = item.path;
      body.appendChild(m);
      var del = document.createElement("button");
      del.className = "pmini"; del.type = "button"; del.textContent = "🗑";
      del.title = "从清单里移除（不动硬盘上的文件夹）";
      del.addEventListener("click", function(ev){ ev.stopPropagation(); subjRemove(i); });
      row.appendChild(icon); row.appendChild(body); row.appendChild(del);
      row.addEventListener("click", function(){
        if(item.exists === false){ say("这个路径不在了：" + item.name); return; }
        ipc.invoke("open-dir", item.path).then(function(r){
          say((r && r.ok) ? ("📂 打开啦：" + item.name) : ("打不开：" + ((r && r.error) || "未知原因")));
        }).catch(function(){ say("打开失败了 🥲"); });
      });
      subjList.appendChild(row);
    });
    if(openPanel === "subj") fitWindowThrottled();
  }

  function subjLoad(){
    return ipc.invoke("folders-get").then(function(r){
      subjects = (r && r.folders) || [];
      subjFile.textContent = (r && r.file) || "";
      subjRender();
    }).catch(function(){ subjects = []; subjRender(); });
  }

  function subjSave(){
    return ipc.invoke("folders-set", subjects.map(function(it){
      return { id: it.id, name: it.name, path: it.path };
    })).then(function(r){
      if(r && r.ok && r.folders) subjects = r.folders;
      return subjLoad();
    }).catch(function(){ say("保存失败了 🥲"); });
  }

  function subjRemove(i){
    var name = subjects[i] && subjects[i].name;
    subjects.splice(i, 1);
    subjSave().then(function(){ say("已移除：" + name); });
  }

  function subjAdd(){
    ipc.invoke("pick-dir", "").then(function(p){
      if(!p) return;
      for(var i=0;i<subjects.length;i++){
        if(subjects[i].path.toLowerCase() === p.toLowerCase()){ say("这个已经在清单里了 📚"); return; }
      }
      subjects.push({ id: "f" + Date.now().toString(36), name: baseName(p), path: p });
      subjSave().then(function(){ showPanel("subj"); say("加好了：" + baseName(p)); });
    });
  }

  // 挑一个根目录，把它的一级子文件夹一次全加成科目
  function subjImport(){
    ipc.invoke("pick-dir", "").then(function(root){
      if(!root) return null;
      return ipc.invoke("subdirs", root).then(function(r){
        if(!r || !r.ok){ say("读不了这个目录：" + ((r && r.error) || "未知原因")); return; }
        var have = {};
        subjects.forEach(function(s){ have[s.path.toLowerCase()] = 1; });
        var added = 0;
        r.dirs.forEach(function(d){
          if(have[d.path.toLowerCase()]) return;
          subjects.push({ id: "f" + Date.now().toString(36) + added, name: d.name, path: d.path });
          added += 1;
        });
        if(!added){ say("这个目录下没有新科目"); return; }
        subjSave().then(function(){ showPanel("subj"); say("导入了 " + added + " 个科目"); });
      });
    }).catch(function(){ say("导入失败了 🥲"); });
  }

  folderBtn.addEventListener("click", function(e){
    e.stopPropagation();
    if(openPanel === "subj"){ showPanel(null); return; }
    subjLoad().then(function(){ showPanel("subj"); });
  });
  folderBtn.addEventListener("contextmenu", function(e){
    e.preventDefault(); e.stopPropagation(); subjAdd();
  });
  document.getElementById("subjAdd").addEventListener("click", function(e){ e.stopPropagation(); subjAdd(); });
  document.getElementById("subjImport").addEventListener("click", function(e){ e.stopPropagation(); subjImport(); });

  /* ══ 📅 日程 / deadline ══ */
  var events = [], calList = document.getElementById("calList"), calBadge = document.getElementById("calBadge");
  var calTitle = document.getElementById("calTitle"), calDate = document.getElementById("calDate"),
      calTime = document.getElementById("calTime"), calNote = document.getElementById("calNote");

  function calYmd(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
  function calToday(){ return calYmd(new Date()); }
  function calDays(dateStr){
    var a = new Date(dateStr + "T00:00:00").getTime(), b = new Date(calToday() + "T00:00:00").getTime();
    return Math.round((a - b) / 86400000);
  }
  function calChip(ev){
    if(ev.done) return "已完成";
    var d = calDays(ev.date);
    if(d < 0) return "逾期 " + (-d) + " 天";
    if(d === 0) return "今天";
    if(d === 1) return "明天";
    return d + " 天后";
  }

  function calRender(){
    calList.innerHTML = "";
    var sorted = events.slice().sort(function(a, b){
      if(a.done !== b.done) return a.done ? 1 : -1;
      return (a.date + " " + a.time).localeCompare(b.date + " " + b.time);
    });
    if(!sorted.length){
      var e = document.createElement("div");
      e.className = "pempty";
      e.textContent = "还没有日程。上面填一行加进来，到点我会提醒你。";
      calList.appendChild(e);
    }
    sorted.forEach(function(ev){
      var d = calDays(ev.date);
      var row = document.createElement("div");
      row.className = "prow static" + (ev.done ? " done" : d < 0 ? " late" : d <= 2 ? " soon" : "");
      var tick = document.createElement("button");
      tick.className = "pmini"; tick.type = "button";
      tick.textContent = ev.done ? "☑" : "☐";
      tick.title = ev.done ? "标回未完成" : "标记完成";
      tick.style.fontSize = "14px";
      tick.addEventListener("click", function(){ calToggle(ev); });
      var body = document.createElement("div");
      body.className = "pbody";
      var t = document.createElement("div");
      t.className = "pt"; t.textContent = ev.title;
      t.title = ev.title + (ev.note ? "\n" + ev.note : "");
      body.appendChild(t);
      var m = document.createElement("div");
      m.className = "pm";
      m.textContent = ev.date + (ev.time ? " " + ev.time : "") + (ev.note ? " · " + ev.note : "");
      body.appendChild(m);
      var chip = document.createElement("span");
      chip.className = "pchip"; chip.textContent = calChip(ev);
      var del = document.createElement("button");
      del.className = "pmini"; del.type = "button"; del.textContent = "🗑";
      del.title = "删掉这条";
      del.addEventListener("click", function(){ calRemove(ev); });
      row.appendChild(tick); row.appendChild(body); row.appendChild(chip); row.appendChild(del);
      calList.appendChild(row);
    });
    var due = events.filter(function(ev){ return !ev.done && calDays(ev.date) <= 2; }).length;
    calBadge.textContent = due > 9 ? "9+" : String(due);
    calBadge.className = "badge" + (due > 0 ? " show" : "");
    calBtn.title = due > 0 ? ("日程 / deadline（有 " + due + " 条要到期了）") : "日程 / deadline";
    if(openPanel === "cal") fitWindowThrottled();
  }

  function calLoad(){
    return ipc.invoke("calendar-get").then(function(r){
      events = (r && r.events) || [];
      calRender();
    }).catch(function(){ events = []; calRender(); });
  }

  function calSave(){
    return ipc.invoke("calendar-set", events).then(function(r){
      if(r && r.ok && r.events) events = r.events;
      calRender();
    }).catch(function(){ say("日程保存失败了 🥲"); });
  }

  function calAdd(){
    var title = calTitle.value.trim(), date = calDate.value || "";
    if(!title){ say("先写个标题吧 ✍️"); calTitle.focus(); return; }
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ say("挑一个日期 📅"); calDate.focus(); return; }
    events.push({ id: "e" + Date.now().toString(36), title: title, date: date,
                  time: calTime.value || "", note: calNote.value.trim(), done: false });
    calTitle.value = ""; calNote.value = "";
    calSave().then(function(){ say("记下了：" + title); });
  }

  function calToggle(ev){
    events = events.map(function(item){
      return item.id === ev.id ? Object.assign({}, item, { done: !item.done }) : item;
    });
    calSave();
  }

  function calRemove(ev){
    events = events.filter(function(item){ return item.id !== ev.id; });
    calSave().then(function(){ say("删掉了：" + ev.title); });
  }

  /** 到点提醒：未完成、2 天内到期（含逾期）就弹一次系统通知 + 说一句。 */
  function calCheck(){
    var today = calToday(), first = null;
    events.forEach(function(ev){
      if(ev.done) return;
      var d = calDays(ev.date);
      if(d > 2) return;
      var key = "dswg_reminded_" + ev.id + "_" + today;
      try { if(localStorage.getItem(key)) return; localStorage.setItem(key, "1"); } catch(err) {}
      var text = d < 0 ? ("「" + ev.title + "」已经逾期 " + (-d) + " 天啦")
               : d === 0 ? ("今天就是「" + ev.title + "」的 deadline！")
               : ("还有 " + d + " 天：「" + ev.title + "」");
      if(!first) first = text;
      ipc.invoke("notify", { title: "鲸鱼娘提醒", body: text }).catch(function(){});
    });
    if(first) say(first);
  }

  calBtn.addEventListener("click", function(e){
    e.stopPropagation();
    if(openPanel === "cal"){ showPanel(null); return; }
    calLoad().then(function(){
      if(!calDate.value) calDate.value = calToday();
      showPanel("cal");
    });
  });
  document.getElementById("calAdd").addEventListener("click", function(e){ e.stopPropagation(); calAdd(); });
  calTitle.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); calAdd(); } });

  /* ══ 📖 读书材料片段 ══ */
  var rdFiles = [], rdResults = [], rdCache = {}, rdBusy = false, rdDir = "";
  var rdList = document.getElementById("rdList"), rdInfo = document.getElementById("rdInfo"),
      rdPath = document.getElementById("rdPath"), rdProg = document.getElementById("rdProg"),
      rdGo = document.getElementById("rdGo"), rdIndexBtn = document.getElementById("rdIndex");

  var RD_PROMPT = [
    "这是从读书材料里截下来的一张图（论文、课件、笔记都有可能）。请做两件事：",
    "1. 给它起一个可以用来检索的短名字，不超过 12 个汉字，要具体，别用「图片」「内容」这种泛称；",
    "2. 用一句话说明它讲了什么，不超过 40 字。",
    "严格只输出两行：第一行是名字，第二行是说明。不要编号、不要 markdown、不要客套。"
  ].join("\n");

  function rdSetInfo(){
    rdInfo.textContent = rdDir === "" ? "还没选文件夹"
      : (rdFiles.length ? ("找到 " + rdFiles.length + " 张图") : "没找到图片");
    rdPath.textContent = rdDir;
    rdGo.disabled = rdBusy || rdFiles.length === 0;
    rdIndexBtn.disabled = rdBusy || rdResults.filter(function(r){ return !r.failed; }).length === 0;
  }

  function rdRender(){
    rdList.innerHTML = "";
    if(!rdResults.length){
      var e = document.createElement("div");
      e.className = "pempty";
      e.textContent = rdFiles.length ? "还没开始。点「开始略读」，我会一张一张看过去。"
                                     : "选一个文件夹，我先数数里面有多少张图。";
      rdList.appendChild(e);
      return;
    }
    rdResults.forEach(function(item){
      var row = document.createElement("div");
      row.className = "prow static";
      row.title = "点一下打开这个文件夹";
      row.addEventListener("click", function(){ if(rdDir) ipc.invoke("open-dir", rdDir).catch(function(){}); });
      var body = document.createElement("div");
      body.className = "pbody";
      var t = document.createElement("div");
      t.className = "pt"; t.style.whiteSpace = "normal";
      t.textContent = (item.failed ? "⚠️ " : "🏷 ") + item.name;
      body.appendChild(t);
      var m = document.createElement("div");
      m.className = "pm"; m.textContent = item.note || "";
      body.appendChild(m);
      var s = document.createElement("div");
      s.className = "psrc"; s.textContent = item.file;
      body.appendChild(s);
      row.appendChild(body);
      if(item.cached){
        var chip = document.createElement("span");
        chip.className = "pchip cached"; chip.textContent = "缓存";
        row.appendChild(chip);
      }
      rdList.appendChild(row);
    });
  }

  /** 缩到长边 1600 再送出去：原图动辄几 MB，模型也用不上那么大。 */
  function rdShrink(dataUrl){
    return new Promise(function(resolve){
      var probe = new Image();
      probe.onload = function(){
        var max = 1600, scale = Math.min(1, max / Math.max(probe.width, probe.height));
        var w = Math.max(1, Math.round(probe.width * scale)), h = Math.max(1, Math.round(probe.height * scale));
        var c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(probe, 0, 0, w, h);
        try { resolve(c.toDataURL("image/jpeg", 0.9)); } catch(err) { resolve(dataUrl); }
      };
      probe.onerror = function(){ resolve(dataUrl); };
      probe.src = dataUrl;
    });
  }

  /** 一次视觉调用。复用本应用原有的 getKey() 和模型，不另开一套密钥存储。 */
  function rdAnalyze(dataUrl){
    var key = getKey();
    if(!key) return Promise.reject(new Error("no-key"));
    return fetcht("https://api.deepseek.com/chat/completions", 60000, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + key },
      body: JSON.stringify({
        model: "deepseek-v4-flash-vision-exp",
        messages: [{ role: "user", content: [
          { type: "text", text: RD_PROMPT },
          { type: "image_url", image_url: { url: dataUrl } }
        ]}],
        max_tokens: 800,
        stream: false
      })
    }).then(function(r){
      if(!r.ok) throw new Error("http-" + r.status);
      return r.json();
    }).then(function(j){
      var choice = j && j.choices && j.choices[0];
      var text = choice && choice.message && choice.message.content;
      if(!text) throw new Error("模型没返回正文（finish_reason=" + ((choice && choice.finish_reason) || "?") + "）");
      return String(text).trim();
    });
  }

  /** 模型只吐两行；拿不到就退回原文件名。 */
  function rdParse(text, filename){
    var lines = String(text || "").split(/\r?\n/).map(function(s){ return s.trim(); })
      .filter(function(s){ return s !== ""; });
    function clean(s){
      return String(s || "").replace(/^\s*\d+\s*[.、)]\s*/, "").replace(/^[#*\-\s]+/, "")
        .replace(/^[「『"'《]+/, "").replace(/[」』"'》]+$/, "").trim();
    }
    var name = clean(lines[0] || "");
    var note = clean(lines[1] || "");
    if(name === "" || name.length > 24) name = filename.replace(/\.[^.]+$/, "").slice(0, 20);
    return { name: name.slice(0, 24), note: note.slice(0, 80) };
  }

  document.getElementById("rdPick").addEventListener("click", function(e){
    e.stopPropagation();
    ipc.invoke("pick-dir", rdDir).then(function(dir){
      if(!dir) return null;
      rdDir = dir; rdResults = [];
      return ipc.invoke("reader-scan", dir).then(function(result){
        if(!result || !result.ok){ say("读不了这个文件夹：" + ((result && result.error) || "未知原因")); return; }
        rdFiles = result.files || [];
        rdProg.textContent = rdFiles.length === 0 ? "这个文件夹里没有图片（png / jpg / webp / bmp / gif / tif）" : "";
        rdRender(); rdSetInfo(); fitWindowThrottled();
      });
    }).catch(function(){ say("选文件夹失败了 🥲"); });
  });

  rdGo.addEventListener("click", function(e){
    e.stopPropagation();
    if(rdBusy || rdFiles.length === 0) return;
    if(!getKey()){ say("先用右上角 🔑 填一个 API Key"); openKeybox(); return; }

    ipc.invoke("reader-cache-get").then(function(cacheResult){
      rdCache = (cacheResult && cacheResult.cache) || {};
      rdBusy = true; rdSetInfo(); rdResults = []; rdRender();
      return rdLoop();
    });
  });

  function rdLoop(){
    var done = 0, fresh = 0, reused = 0, failed = 0;
    function step(){
      if(done >= rdFiles.length){
        rdBusy = false;
        rdProg.textContent = "完成 " + rdResults.length + " 条（新读 " + fresh + " · 缓存 " + reused
          + (failed ? " · 失败 " + failed : "") + "）";
        rdSetInfo();
        say("读完啦：" + rdResults.length + " 个片段");
        fitWindowThrottled();
        return null;
      }
      var file = rdFiles[done];
      done += 1;
      var cacheKey = file.path + "|" + file.size + "|" + file.mtime;
      var hit = rdCache[cacheKey];
      if(hit){
        rdResults.push({ file: file.name, name: hit.name, note: hit.note, cached: true });
        reused += 1;
        rdProg.textContent = "进度 " + done + "/" + rdFiles.length + " · 用缓存：" + file.name;
        rdRender();
        return Promise.resolve().then(step);
      }
      rdProg.textContent = "进度 " + done + "/" + rdFiles.length + " · 正在看 " + file.name + " …";
      return ipc.invoke("reader-read", file.path).then(function(read){
        if(!read || !read.ok){
          rdResults.push({ file: file.name, name: "读不了这个文件", note: (read && read.error) || "", failed: true });
          failed += 1; rdRender();
          return null;
        }
        return rdShrink(read.dataUrl).then(rdAnalyze);
      }).then(function(answer){
        if(answer === null) return null;  // 上一步已经记过失败
        var parsed = rdParse(answer, file.name);
        rdCache[cacheKey] = { name: parsed.name, note: parsed.note, at: Date.now() };
        rdResults.push({ file: file.name, name: parsed.name, note: parsed.note });
        fresh += 1; rdRender();
        return ipc.invoke("reader-cache-set", rdCache).catch(function(){});
      }).catch(function(err){
        var msg = (err && err.message) || String(err);
        if(msg === "no-key"){ rdBusy = false; rdSetInfo(); say("API Key 不见了，重新填一个 🔑"); openKeybox(); return "stop"; }
        rdResults.push({ file: file.name, name: "没读成功", note: msg, failed: true });
        failed += 1; rdRender();
      }).then(function(signal){
        if(signal === "stop") return null;
        return new Promise(function(r){ setTimeout(r, 30); }).then(step);
      });
    }
    return Promise.resolve().then(step);
  }

  rdIndexBtn.addEventListener("click", function(e){
    e.stopPropagation();
    var entries = rdResults.filter(function(r){ return !r.failed; })
      .map(function(r){ return { name: r.name, note: r.note, file: r.file }; });
    if(!entries.length){ say("还没有可导出的结果"); return; }
    ipc.invoke("reader-write-index", { dir: rdDir, entries: entries }).then(function(result){
      if(result && result.ok){ say("索引写好了：_鲸鱼娘索引.md"); rdProg.textContent = result.file; }
      else say("写索引失败：" + ((result && result.error) || "未知原因"));
    });
  });

  rdBtn.addEventListener("click", function(e){
    e.stopPropagation();
    if(openPanel === "rd"){ showPanel(null); return; }
    showPanel("rd");
  });

  // 启动时把已有数据读进来（角标要显示，所以日程一开始就读）
  subjLoad();
  calLoad().then(function(){
    setTimeout(calCheck, 900);
    setInterval(calCheck, 5 * 60 * 1000);
  });

  // 悬停放大 / 单击晃动词条 / 双击输入
  wrap.addEventListener("mouseenter", function(){ wrap.classList.add("hover"); });
  wrap.addEventListener("mouseleave", function(){ wrap.classList.remove("hover"); });
  // 让她说一句话,3.6 秒后自己恢复成平时的轮播台词(📁 按钮也复用这个)
  function say(line){ balloon.textContent=line; balloon.classList.add("talk");
    clearTimeout(sayTimer); sayTimer=setTimeout(function(){ balloon.classList.remove("talk"); balloon.textContent=CHAT[lineIdx]; },3600); }
  function sayClick(){ say(CLICK[Math.floor(Math.random()*CLICK.length)]); }
  wrap.addEventListener("click", function(e){ if(e.target===input||e.target===toggle) return;
    wrap.classList.remove("jump"); void wrap.offsetWidth; wrap.classList.add("jump");
    setTimeout(function(){ wrap.classList.remove("jump"); },650); sayClick(); });
  img.addEventListener("dblclick", function(){ win.classList.remove("answered","pasting"); win.classList.add("typing"); document.getElementById("ans").style.display="none"; fitWindowThrottled(); setTimeout(function(){ input.focus(); },40); });
  input.addEventListener("keydown", function(e){ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); var t=input.value.trim(); input.value=""; if(t) ask(t); } });
  toggle.addEventListener("click", function(){ ipc.send("quit"); });

  window.addEventListener("keydown", function(e){ if(e.key==="Escape" && keybox.classList.contains("show")) closeKeybox(); });

  setInterval(function(){ lineIdx=(lineIdx+1)%CHAT.length; if(!balloon.classList.contains("talk") && !win.classList.contains("pasting")) balloon.textContent=CHAT[lineIdx]; }, 9000);

  // 拖动（IPC，让图片仍可点击/双击）
  var drag=null;
  win.addEventListener("mousedown", function(e){ if(e.target===toggle||e.target===input||e.target===bulb||e.target===folderBtn||e.target===keybtn||e.target.closest(".keybox")||e.target.closest(".docbtn")||e.target.closest("#words")||e.target.closest(".panel")) return;
    drag={x:e.screenX,y:e.screenY}; wrap.classList.add("drag"); ipc.send("drag-start",{x:e.screenX,y:e.screenY}); e.preventDefault(); });
  window.addEventListener("mousemove", function(e){ if(drag) ipc.send("drag-move",{x:e.screenX,y:e.screenY}); });
  window.addEventListener("mouseup", function(){ if(drag){ wrap.classList.remove("drag"); ipc.send("drag-end"); drag=null; } });

  // 透明区域鼠标穿透：只有悬停到鲸鱼娘/按钮/单词本等可交互元素上时才接管鼠标
  // 末尾的 `button` 是兜底:凡是 <button> 一律接管点击,以后再加按钮不用回来改这份名单
  // (📁 就是漏在这里才点不动的 —— 窗口一直穿透,点击直接穿过去打到了后面的窗口)。
  var msIgnore = null;
  document.addEventListener("mousemove", function(e){
    var el = document.elementFromPoint(e.clientX, e.clientY);
    var hit = !!(el && el.closest && el.closest(".whale-wrap,.bulb,.folderbtn,.calbtn,.rdbtn,.toggle,.keybtn,.keybox,.kbtn,.kinput,.input,.paste,.words,.entry,.docbtn,.panel,button"));
    if (drag) hit = true; // 拖动过程中保持接管，避免中途丢失鼠标
    if (msIgnore !== hit) { msIgnore = hit; ipc.send("ignore-mouse", !hit); }
  });
</script>
</body>
