<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:-apple-system,Segoe UI,Microsoft YaHei,sans-serif;-webkit-user-select:none;user-select:none}
  #box{position:absolute;inset:0;box-sizing:border-box;padding:12px 16px 10px;display:flex;gap:14px;align-items:stretch;
       background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(238,246,255,.96));
       border:1px solid rgba(120,165,225,.55);border-radius:18px;
       box-shadow:0 10px 34px rgba(30,60,110,.32),inset 0 1px 0 rgba(255,255,255,.9);
       backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  /* 左侧角色图 */
  .art{flex:none;width:150px;height:148px;object-fit:cover;object-position:top center;border-radius:12px;
       box-shadow:0 0 0 1px rgba(120,165,225,.5),0 6px 18px rgba(30,60,110,.25);background:#eaf3ff}
  .content{flex:1;min-width:0;display:flex;flex-direction:column}
  /* 名字牌：完全在框内 */
  .name{align-self:flex-start;display:inline-flex;align-items:center;background:linear-gradient(160deg,#3b82f6,#1d5fd0);
        color:#fff;font-size:13.5px;font-weight:600;letter-spacing:.5px;padding:4px 14px 4px 9px;border-radius:9px;
        box-shadow:0 3px 10px rgba(30,90,200,.35);margin-bottom:6px}
  .name::before{content:'【'}.name::after{content:'】'}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#cfe9ff;margin-right:6px;box-shadow:0 0 8px #8ec4ff}
  .text{flex:1;overflow:auto;color:#1c3c6e;font-size:15.5px;line-height:1.75;padding-right:8px;white-space:pre-wrap;word-break:break-word}
  .text::-webkit-scrollbar{width:8px}
  .text::-webkit-scrollbar-thumb{background:rgba(120,160,220,.5);border-radius:6px}
  .menu{flex:none;display:flex;gap:14px;justify-content:flex-end;color:#5c7bab;font-size:11.5px;letter-spacing:.5px;padding-top:2px}
  .menu span{opacity:.75}
  .menu span.exit{cursor:pointer;opacity:1;color:#2a5bb0}
  .menu span.exit:hover{text-decoration:underline}
  .close{position:absolute;top:8px;right:10px;width:26px;height:26px;border-radius:50%;border:none;cursor:pointer;
         background:linear-gradient(160deg,#3b82f6,#1d5fd0);color:#fff;font-size:15px;line-height:1;box-shadow:0 3px 10px rgba(30,90,200,.4);z-index:5}
  .close:hover{transform:scale(1.1)}
</style>
</head>
